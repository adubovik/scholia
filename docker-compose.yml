services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scholia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scholia"]
      interval: 5s
      timeout: 5s
      retries: 10

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@db:5432/scholia
    ports:
      - "4444:4444"
    depends_on:
      db:
        condition: service_healthy

  migrate-seed:
    build: .
    command: ["sh", "scripts/docker-seed.sh"]
    depends_on:
      db:
        condition: service_healthy
      neon-proxy:
        condition: service_started
    restart: "no"

  app:
    build: .
    environment:
      SCHOLIA_AUTH: dev
      SCHOLIA_LOCAL_DB: "1"
      DATABASE_URL: postgres://postgres:postgres@neon-proxy:5432/scholia
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      migrate-seed:
        condition: service_completed_successfully
