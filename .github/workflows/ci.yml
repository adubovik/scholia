name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]

# One run per branch; a newer push cancels the older, still-running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint + test
    runs-on: ubuntu-latest
    # pnpm 11 runs an implicit `install` before every `pnpm run` to verify deps
    # are in sync; on a cold CI store it re-evaluates the ignored build scripts
    # (esbuild/sharp/unrs-resolver) and fails hard. Disable that pre-run check so
    # lint/test don't reinstall — the explicit install step below already did.
    env:
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # strict-dep-builds=false: those build scripts aren't needed for lint/test,
      # so make their being ignored a warning instead of a hard error.
      - run: pnpm install --frozen-lockfile --config.strict-dep-builds=false
      - run: pnpm lint
      # Integration tests hit a real Postgres via the neon-http proxy — the same
      # ephemeral stack docker-compose runs locally. Start it, create the schema
      # directly on Postgres (drizzle-kit speaks pg, bypassing the proxy), then
      # run the suite against the proxy.
      - name: Start Postgres + neon-http proxy
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait db neon-proxy
      - name: Push schema
        run: pnpm drizzle-kit push --force
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/scholia
      - name: Test
        run: pnpm test
        env:
          SCHOLIA_LOCAL_DB: "1"
          DATABASE_URL: postgres://postgres:postgres@localhost:4444/scholia

  deploy:
    name: deploy (production)
    needs: ci # gate: no deploy unless lint + test are green
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global vercel@latest
      # Remote build: upload source and let Vercel build in its own environment
      # (the same pipeline that already builds this app on every push). Avoids
      # reproducing Vercel's toolchain — pnpm, env, node — on the runner.
      - run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
